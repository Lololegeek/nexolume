# nginx server block for the static browser build (artifacts/web copied to /srv/nexolume).
# Include it from http { } or copy it to /etc/nginx/conf.d/nexolume.conf and adapt server_name/TLS.
server {
    listen 80;
    server_name _;
    root /srv/nexolume;
    index index.html;

    # .wasm must be served as application/wasm for streaming compilation. Both types blocks merge;
    # a lone types block would replace the default MIME table.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
        application/octet-stream dll dat pdb;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream text/javascript application/javascript application/json text/css;
    # Serve the .br/.gz files produced by dotnet publish when the brotli/gzip_static modules exist.
    gzip_static on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Fingerprinted runtime files never change for a given URL.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Entry points and the unversioned engine must be revalidated so updates are picked up.
    location ~ ^/(index\.html|sw\.js|precache\.json|manifest\.webmanifest|main\.js|interop\.js|engine/) {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
